name: Release Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-release-gate:
    name: Source Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REF: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag format
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be semver-like: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run source release gate
        run: npm run verify:release

      - name: Capture schema state hash
        run: node scripts/schema-state.mjs

      - name: Upload schema state artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-schema-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/schema-state/schema-state.json
          if-no-files-found: error

      - name: Release validation summary
        shell: bash
        run: |
          {
            echo "## Release Validation"
            echo "- Ref: ${RELEASE_REF}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Source gate: npm run verify:release"
            echo "- Result: PASS"
            echo "- Live disposable-environment verification: NOT EXECUTED by this source workflow"
          } >> "$GITHUB_STEP_SUMMARY"
